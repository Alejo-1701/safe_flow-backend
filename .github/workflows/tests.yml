name: tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Ejecutar suite de pruebas
        run: python manage.py test --settings=config.settings_test --testrunner=config.test_runner.SeedRunner --verbosity 2
